<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 122" width="160" height="122" role="img" aria-label="Instagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lb{fill:#1f2328}
    @media (prefers-color-scheme: dark){.lb{fill:#f0f6fc}.rim{stroke:#ffffff;stroke-opacity:.22}}
    .rim{stroke:#000000;stroke-opacity:.08}
    .float{animation:float 3.4s ease-in-out infinite;animation-delay:-1.2s}
    @keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
    .orbit{transform-origin:80px 50px;animation:orbit 6.9s linear infinite;animation-delay:-2.4s}
    @keyframes orbit{to{transform:rotate(360deg)}}
    .sonar{transform-origin:80px 50px;animation:sonar 3.2s ease-out infinite}
    .sonar2{animation-delay:1.6s}
    @keyframes sonar{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
    .glow{animation:glow 3.4s ease-in-out infinite;animation-delay:-1.2s}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    .tw{animation:tw 2.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  </style>
  <defs>
    <linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#feda75"/><stop offset=".3" stop-color="#fa7e1e"/><stop offset=".55" stop-color="#d62976"/><stop offset=".8" stop-color="#962fbf"/><stop offset="1" stop-color="#4f5bd5"/></linearGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#dd2a7b" stop-opacity=".55"/><stop offset="1" stop-color="#dd2a7b" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="glow" cx="80" cy="50" r="52" fill="url(#g)"/>
  <circle class="sonar" cx="80" cy="50" r="32" fill="none" stroke="#dd2a7b" stroke-width="2"/>
  <circle class="sonar sonar2" cx="80" cy="50" r="32" fill="none" stroke="#dd2a7b" stroke-width="2"/>
  <g class="orbit">
    <g transform="translate(80,6)"><circle class="tw" r="3" fill="#f97316" style="transform-origin:0 0"/><circle r="6" fill="#f97316" opacity=".18"/></g>
  </g>
