<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 122" width="160" height="122" role="img" aria-label="LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lb{fill:#1f2328}
    @media (prefers-color-scheme: dark){.lb{fill:#f0f6fc}.rim{stroke:#ffffff;stroke-opacity:.22}}
    .rim{stroke:#000000;stroke-opacity:.08}
    .float{animation:float 3.4s ease-in-out infinite;animation-delay:-0.6s}
    @keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
    .orbit{transform-origin:80px 50px;animation:orbit 6.2s linear infinite;animation-delay:-1.2s}
    @keyframes orbit{to{transform:rotate(360deg)}}
    .sonar{transform-origin:80px 50px;animation:sonar 3.2s ease-out infinite}
    .sonar2{animation-delay:1.6s}
    @keyframes sonar{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
    .glow{animation:glow 3.4s ease-in-out infinite;animation-delay:-0.6s}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    .tw{animation:tw 2.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  </style>
  <defs>
    
