<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 122" width="160" height="122" role="img" aria-label="Email" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .lb{fill:#1f2328}
    @media (prefers-color-scheme: dark){.lb{fill:#f0f6fc}.rim{stroke:#ffffff;stroke-opacity:.22}}
    .rim{stroke:#000000;stroke-opacity:.08}
    .float{animation:float 3.4s ease-in-out infinite;animation-delay:-1.8s}
    @keyframes float{0%,100%{transform:translateY(2px)}50%{transform:translateY(-3px)}}
    .orbit{transform-origin:80px 50px;animation:orbit 7.6s linear infinite;animation-delay:-3.6s}
    @keyframes orbit{to{transform:rotate(360deg)}}
    .sonar{transform-origin:80px 50px;animation:sonar 3.2s ease-out infinite}
    .sonar2{animation-delay:1.6s}
    @keyframes sonar{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
    .glow{animation:glow 3.4s ease-in-out infinite;animation-delay:-1.8s}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
    .tw{animation:tw 2.2s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
  </style>
  <defs>
    
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#EA4335" stop-opacity=".55"/><stop offset="1" stop-color="#EA4335" stop-opacity="0"/></radialGradient>
  </defs>
  <circle class="glow" cx="80" cy="50" r="52" fill="url(#g)"/>
  <circle class="sonar" cx="80" cy="50" r="32" fill="none" stroke="#EA4335" stroke-width="2"/>
  <circle class="sonar sonar2" cx="80" cy="50" r="32" fill="none" stroke="#EA4335" stroke-width="2"/>
  <g class="orbit">
    <g transform="translate(80,6)"><circle class="tw" r="3" fill="#f97316" style="transform-origin:0 0"/><circle r="6" fill="#f97316" opacity=".18"/></g>
  </g>
  <g class="float">
    <circle cx="80" cy="50" r="32" fill="#EA4335"/>
    <circle class="rim" cx="80" cy="50" r="32" fill="none" stroke-width="1.5"/>
    <g transform="translate(62,32) scale(1.5)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#ffffff"/></g>
  </g>
  <text class="lb" x="80" y="112" font-size="12" text-anchor="middle" letter-spacing="1.5">EMAIL</text>
</svg>
