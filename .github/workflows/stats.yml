name: Update GitHub stats

on:
  schedule:
    - cron: "0 */6 * * *"      # otomatis tiap 6 jam
  workflow_dispatch:           # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate assets/stats.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          # Opsional: isi secret GH_STATS_TOKEN (PAT, scope read:user) agar kontribusi
          # privat ikut terhitung. Tanpa itu, dipakai GITHUB_TOKEN bawaan (data publik).
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update stats"
            git push
          fi
